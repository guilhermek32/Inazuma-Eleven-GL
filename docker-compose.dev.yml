# Development override: a debug match runtime that also accepts
# "dev:<team>" tokens and creates rooms on first use, for testing online play
# without going through the lobby. Lobby-issued credentials keep working.
# Never deploy this. Needs the same .env as the main file.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   then open, in two browser windows:
#     http://localhost:8080/?match=test1&token=dev:0
#     http://localhost:8080/?match=test1&token=dev:1

services:
  match-runtime:
    build:
      target: match-runtime-dev
    environment:
      DEV_NO_AUTH: "1"
    # The debug image runs as root: keep its state off the production volume,
    # which the release runtime (uid 10001) must be able to write.
    volumes:
      - runtime-data-dev:/data

volumes:
  runtime-data-dev: {}
