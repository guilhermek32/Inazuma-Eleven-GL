# Online deployment: gateway + three business services + PostgreSQL.
#
#   cp .env.example .env               # then set real secrets
#   docker compose up --build          # then open http://localhost:8080
#
# Services
#   gateway        Caddy: TLS, the web build, and the only published ports.
#                  /api/lobby/v1/* -> lobby, /api/stats/v1/* -> results,
#                  /ws/game/*      -> match-runtime (player WebSocket)
#   lobby          rooms, guest players, reservations, signed credentials
#   match-runtime  authoritative headless Godot matches (8910 players,
#                  8911 internal control API) + durable result spool
#   results        match history and leaderboard
#   ai-bot         optional AI opponent for vs-AI rooms: headless Godot bot
#                  sessions that join the runtime like a browser (8920
#                  internal job API). Stopping it only disables vs-AI.
#   postgres       infrastructure: separate lobby and results databases/roles
#
# Godot's web build only starts in a secure context: http://localhost works for
# local play, but any other host needs HTTPS. Set SITE_ADDRESS to the public
# domain (e.g. SITE_ADDRESS=game.example.com) and Caddy obtains a certificate.
#
# Every service except the gateway sits only on the internal network, which
# has no route to the outside world; internal APIs (runtime control, results
# ingestion) are never routed by the gateway. DEV_NO_AUTH is never set here
# (see docker-compose.dev.yml).

name: inazuma-online

x-secrets:
  match-secret: &match-secret ${MATCH_SECRET:?set MATCH_SECRET in .env (see .env.example)}
  control-token: &control-token ${RUNTIME_CONTROL_TOKEN:?set RUNTIME_CONTROL_TOKEN in .env (see .env.example)}
  ingest-token: &ingest-token ${RESULTS_INGEST_TOKEN:?set RESULTS_INGEST_TOKEN in .env (see .env.example)}
  bot-token: &bot-token ${BOT_CONTROL_TOKEN:?set BOT_CONTROL_TOKEN in .env (see .env.example)}

# Every container logs JSON lines to Docker's json-file driver, rotated so a
# long-running VPS can't fill its disk: at most 5 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    build:
      context: .
      dockerfile: tools/godot/Dockerfile
      target: gateway
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
      - "${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
    networks: [public, internal]
    depends_on:
      match-runtime:
        condition: service_healthy
      lobby:
        condition: service_healthy
      results:
        condition: service_healthy
    healthcheck:
      # Internal listener: works whether :80 serves the site or only redirects to HTTPS.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging: *logging

  match-runtime:
    build:
      context: .
      dockerfile: tools/godot/Dockerfile
      target: match-runtime
    environment:
      MATCH_RUNTIME_PORT: "8910"
      RUNTIME_CONTROL_PORT: "8911"
      RUNTIME_DATA_DIR: /data
      MATCH_SECRET: *match-secret
      RUNTIME_CONTROL_TOKEN: *control-token
      RESULTS_URL: http://results:8000
      RESULTS_INGEST_TOKEN: *ingest-token
      RUNTIME_MAX_CONNECTIONS: ${RUNTIME_MAX_CONNECTIONS:-64}
      RUNTIME_MAX_ROOMS: ${RUNTIME_MAX_ROOMS:-32}
    volumes:
      - runtime-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8911/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging: *logging

  lobby:
    build:
      context: services/lobby
      target: service
    environment:
      DATABASE_URL: postgresql://lobby:${LOBBY_DB_PASSWORD:?set LOBBY_DB_PASSWORD in .env}@postgres:5432/lobby
      MATCH_SECRET: *match-secret
      RUNTIME_CONTROL_URL: http://match-runtime:8911
      RUNTIME_CONTROL_TOKEN: *control-token
      BOT_SERVICE_URL: http://ai-bot:8920
      BOT_CONTROL_TOKEN: *bot-token
      BOT_RUNTIME_WS_URL: ws://match-runtime:8910
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      match-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    logging: *logging

  # Not a dependency of the lobby: with ai-bot down, vs-AI creation answers
  # 503 bot_unavailable and PvP is unaffected.
  ai-bot:
    build:
      context: .
      dockerfile: tools/godot/Dockerfile
      target: ai-bot
    environment:
      BOT_CONTROL_PORT: "8920"
      BOT_CONTROL_TOKEN: *bot-token
      BOT_MAX_SESSIONS: ${BOT_MAX_SESSIONS:-8}
    networks: [internal]
    depends_on:
      match-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8920/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging: *logging

  results:
    build:
      context: services/results
      target: service
    environment:
      DATABASE_URL: postgresql://results:${RESULTS_DB_PASSWORD:?set RESULTS_DB_PASSWORD in .env}@postgres:5432/results
      RESULTS_INGEST_TOKEN: *ingest-token
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      LOBBY_DB_PASSWORD: ${LOBBY_DB_PASSWORD:?set LOBBY_DB_PASSWORD in .env}
      RESULTS_DB_PASSWORD: ${RESULTS_DB_PASSWORD:?set RESULTS_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      # TCP, not the socket: the init-time server only listens on the socket.
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
    restart: unless-stopped
    logging: *logging

networks:
  public: {}
  internal:
    internal: true

volumes:
  caddy-data: {}
  runtime-data: {}
  postgres-data: {}
